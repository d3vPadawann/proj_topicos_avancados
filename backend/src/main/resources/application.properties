# configuracao do sistema
spring.application.name=FinFamily
server.port=8085

spring.datasource.url=jdbc:h2:file:./data/finfamily_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cache.type=simple

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

finfamily.security.jwt-secret=FinFamilyUCSAL2026TopicosAvancadosChaveSecretaSuperSegura256Bits!
finfamily.security.jwt-expiration-ms=86400000
finfamily.security.aes-key=FinFamilyAES256KeyUCSAL2026Sec!!

finfamily.ai.provedor=${FINFAMILY_AI_PROVEDOR:AUTO}
finfamily.ai.timeout-ms=2800
finfamily.ai.gemini-api-url=https://generativelanguage.googleapis.com/v1beta/models
finfamily.ai.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}
finfamily.ai.gemini-api-key=${GEMINI_API_KEY:}
finfamily.ai.gemini-thinking-level=${GEMINI_THINKING_LEVEL:}
spring.config.import=optional:file:./config/ia.properties
finfamily.ai.ollama-url=${OLLAMA_URL:http://localhost:11434/api/generate}
finfamily.ai.ollama-model=${OLLAMA_MODEL:llama3.2}

finfamily.backup.dir=./backups
finfamily.backup.retention-days=30
